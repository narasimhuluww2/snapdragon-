[project]
name = "ahead"
version = "0.1.0"
description = "AHEAD scheduling engine with ripple impact detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "onnxruntime>=1.24.3",
    "onnxruntime-qnn>=1.17.1",
    "psutil>=7.2.2",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
]

